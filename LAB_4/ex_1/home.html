<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Домик в деревне</title>
  <link rel="stylesheet" href="house.css">
</head>
<body>
  <div class="scene">
    <div class="sun"></div>
    <div class="cloud cloud-1"></div>
    <div class="cloud cloud-2"></div>

    <div class="ground"></div>

    <div class="tree">
      <div class="crown crown-1"></div>
      <div class="crown crown-2"></div>
      <div class="crown crown-3"></div>
      <div class="trunk"></div>
    </div>

    <div class="fence">
      <span></span><span></span><span></span><span></span><span></span>
      <span></span><span></span><span></span><span></span><span></span>
    </div>

    <div class="house">
      <div class="roof"></div>
      <div class="chimney">
        <div class="smoke"></div>
      </div>
      <div class="wall">
        <div class="window window-left">
          <div class="window-cross-h"></div>
          <div class="window-cross-v"></div>
        </div>
        <div class="window window-right">
          <div class="window-cross-h"></div>
          <div class="window-cross-v"></div>
        </div>
        <div class="door">
          <div class="handle"></div>
        </div>
      </div>
    </div>
    
    <!-- Трава поверх земли (зубчики) -->
    <div class="grass"></div>
  </div>
</body>
</html>
