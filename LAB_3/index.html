<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Регистрация в соцсети</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<form class="reg-form" id="regForm" novalidate>
  <h1>Создать аккаунт</h1>

  <!-- Личные данные -->
  <fieldset>
    <legend>Личные данные</legend>

    <div class="field">
      <label for="name">Имя</label>
      <input type="text" id="name" name="name" placeholder="Ваше имя" required>
    </div>

    <div class="field">
      <label for="surname">Фамилия</label>
      <input type="text" id="surname" name="surname" placeholder="Ваша фамилия" required>
    </div>

    <div class="field">
      <label for="birth">Дата рождения</label>
      <input type="date" id="birth" name="birth" placeholder="Дата рождения">
    </div>

    <div class="field">
      <label for="gender">Пол</label>
      <div class="radio-group">
        <label><input type="radio" name="gender" value="m"> Мужской</label>
        <label><input type="radio" name="gender" value="f"> Женский</label>
      </div>
    </div>

    <div class="field">
      <label for="bio">О себе</label>
      <textarea id="bio" name="bio" rows="3" placeholder="Пара слов о себе"></textarea>
    </div>
  </fieldset>

  <!-- Контакты -->
  <fieldset>
    <legend>Контакты</legend>

    <div class="field">
      <label for="email">E-mail</label>
      <input type="email" id="email" name="email" placeholder="you@example.com" required>
    </div>

    <div class="field">
      <label for="phone">Телефон</label>
      <input type="tel" id="phone" name="phone" placeholder="+7 (___) ___-__-__">
    </div>

    <div class="field">
      <label for="site">Сайт</label>
      <input type="url" id="site" name="site" placeholder="https://example.com">
    </div>

    <div class="field">
      <label for="country">Страна</label>
      <select id="country" name="country">
        <optgroup label="СНГ">
          <option value="ru">Россия</option>
          <option value="kz">Казахстан</option>
          <option value="by">Беларусь</option>
        </optgroup>
        <optgroup label="Другие">
          <option value="us">США</option>
          <option value="de">Германия</option>
        </optgroup>
      </select>
    </div>

    <div class="field">
      <label for="city">Город</label>
      <input type="text" id="city" name="city" list="cities" placeholder="Начните вводить город">
      <datalist id="cities">
        <option value="Москва">
        <option value="Санкт-Петербург">
        <option value="Казань">
        <option value="Новосибирск">
      </datalist>
    </div>
  </fieldset>

  <!-- Аккаунт -->
  <fieldset>
    <legend>Данные аккаунта</legend>

    <div class="field">
      <label for="login">Логин</label>
      <input type="text" id="login" name="login" placeholder="Придумайте логин" required>
    </div>

    <div class="field">
      <label for="pass">Пароль</label>
      <input type="password" id="pass" name="pass" placeholder="Не менее 8 символов" required>
    </div>

    <div class="field">
      <label for="pass2">Повтор пароля</label>
      <input type="password" id="pass2" name="pass2" placeholder="Повторите пароль" required>
    </div>

    <div class="field">
      <label for="avatar">Аватар</label>
      <input type="file" id="avatar" name="avatar" accept="image/*">
    </div>

    <div class="field">
      <label for="age">Возраст: <output id="ageOut" for="age">18</output></label>
      <input type="range" id="age" name="age" min="14" max="99" value="18">
    </div>

    <div class="field checkbox">
      <label>
        <input type="checkbox" name="agree" required>
        Я согласен с правилами и политикой конфиденциальности
      </label>
    </div>
  </fieldset>

  <button type="submit">Зарегистрироваться</button>
  <button type="reset" class="secondary">Очистить</button>
</form>

<script>
  const age = document.getElementById('age');
  const out = document.getElementById('ageOut');
  age.addEventListener('input', () => out.value = age.value);
</script>
</body>
</html>
